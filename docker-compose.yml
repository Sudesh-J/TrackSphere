services:
  db:
    image: postgres:16
    container_name: tracksphere-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracksphere
      POSTGRES_PASSWORD: tracksphere_dev
      POSTGRES_DB: tracksphere
    ports:
      - "5433:5432"
    volumes:
      - tracksphere_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/migrate_3_5.sql:/docker-entrypoint-initdb.d/02_migrate_3_5.sql:ro
      - ./database/migrate_4_0.sql:/docker-entrypoint-initdb.d/03_migrate_4_0.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracksphere -d tracksphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:20-bookworm
    container_name: tracksphere-api
    working_dir: /app
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://tracksphere:tracksphere_dev@db:5432/tracksphere
      JWT_SECRET: ${JWT_SECRET:-tracksphere_compose_dev_secret}
      JWT_EXPIRES_IN: 8h
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-tracksphere_local_agent_token}
    volumes:
      - ./backend:/app
      - tracksphere_uploads:/app/uploads
      - /app/node_modules
    command: sh -c "npm install && node src/index.js"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-bookworm
    container_name: tracksphere-web
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  tracksphere_pgdata:
  tracksphere_uploads:
